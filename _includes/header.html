<header class="nav">
  <a class="nav-brand" href="{{ site.baseurl }}/">
    <img src="{{ "/images/logo.png" | prepend: site.baseurl }}" alt="{{ site.sitename }}" style="width: 24px; height: 24px; border-radius: 6px;">
    {{ site.sitename }}
  </a>
  
  <ul class="nav-links">
    <li><a href="{{ "/" | prepend: site.baseurl }}">Home</a></li>
    <li><a href="https://app.xlivewallpaper.com/">App</a></li>
    <li><a href="{{ "/tutorial/How-To-Setup-Live-Wallpaper-English.html" | prepend: site.baseurl }}">Tutorial</a></li>
    <li><a href="{{ "/about" | prepend: site.baseurl }}">About</a></li>
  </ul>
  
  <div class="nav-actions">
    <a class="btn-primary" href="{{ site.app_link }}" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download
    </a>
  </div>
</header>

  <script>
    (function() {
      var path = window.location.pathname.replace(/\/$/, '') || '/';
      var links = document.querySelectorAll('.nav .nav-links a');
      console.log(links);
      var bestMatch = null, bestLen = 0;
      
      links.forEach(function(link) {
        var href = link.getAttribute('href').replace(/\/$/, '') || '/';
        if (path === href) {
          bestMatch = link;
          bestLen = href.length + 1000;
        } else if (href !== '' && href !== '/' && path.startsWith(href) && href.length > bestLen) {
          bestMatch = link;
          bestLen = href.length;
        }
      });
      
      if (!bestMatch) {
        links.forEach(function(link) {
          if ((link.getAttribute('href').replace(/\/$/, '') || '/') === '/') {
            bestMatch = link;
          }
        });
      }
      
      if (bestMatch) {
        bestMatch.classList.add('active');
      }
    })();
  </script>
